name: ticketflow-agent

services:
  api:
    build: .
    image: ticketflow-agent:dev
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - .env
    environment:
      TICKETFLOW_DATA_DIR: /data
    volumes:
      - ticketflow-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  ticketflow-data:
    external: true
    name: ticketflow-data